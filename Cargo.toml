[workspace]
resolver = "2"
members = ["crates/vaugelas", "crates/vaugelas-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
# slice::as_chunks (1.88)
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/Elvis-codeur/vaugelas"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
