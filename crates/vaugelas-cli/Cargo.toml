[package]
name = "vaugelas-cli"
description = "Vaugelas Corrector: command line and LanguageTool-compatible HTTP server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "vaugelas"
path = "src/main.rs"

[dependencies]
vaugelas = { path = "../vaugelas" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"
tiny_http = "0.12"
form_urlencoded = "1"
ureq = "2"
# the resources archive (resources.tar.gz); no extended attributes needed
tar = { version = "0.4", default-features = false }
