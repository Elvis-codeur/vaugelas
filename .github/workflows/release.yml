name: Release
# Builds the binaries on a version tag (v0.1.0, ...) and attaches them to a draft GitHub release.
# The data files (model.frcm.gz, lexicon.tsv.gz) are a separate release (tag data-1), uploaded by hand: see README.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: macos-14, target: aarch64-apple-darwin, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p vaugelas-cli
      - name: Test
        run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          d=vaugelas-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir "$d"
          cp target/${{ matrix.target }}/release/vaugelas README.md NOTICE.md LICENSE-TBD.md "$d"/
          tar czf "$d.tar.gz" "$d"
          shasum -a 256 "$d.tar.gz" > "$d.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "vaugelas-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item target/${{ matrix.target }}/release/vaugelas.exe, README.md, NOTICE.md, LICENSE-TBD.md $d
          Compress-Archive -Path $d -DestinationPath "$d.zip"
          (Get-FileHash "$d.zip" -Algorithm SHA256).Hash.ToLower() + "  $d.zip" | Out-File -Encoding ascii "$d.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            vaugelas-*.tar.gz*
            vaugelas-*.zip*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
